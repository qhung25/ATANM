<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Rail Fence Cipher - Bảo mật thông tin</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            height: 100vh;
            display: flex; justify-content: center; align-items: center; padding: 20px;
        }
        .container {
            background-color: #ffffff; padding: 30px; border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15); width: 100%; max-width: 450px; text-align: center;
        }
        h2 { color: #4a90e2; margin-bottom: 20px; }
        .input-group { text-align: left; margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input {
            width: 100%; padding: 12px; border: 1px solid #ddd;
            border-radius: 6px; font-size: 16px; outline: none;
        }
        .button-group { display: flex; gap: 10px; margin-bottom: 20px; }
        button {
            flex: 1; padding: 12px; border: none; border-radius: 6px;
            font-weight: bold; cursor: pointer; color: white;
        }
        .btn-encrypt { background-color: #4a90e2; }
        .btn-decrypt { background-color: #2ed573; }
        #result {
            background-color: #f8f9fa; padding: 15px; border-radius: 6px;
            border-left: 4px solid #4a90e2; margin-bottom: 20px; text-align: left;
        }
        .nav-links {
            display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
            margin-top: 15px; border-top: 1px solid #eee; padding-top: 15px;
        }
        .nav-links a {
            text-decoration: none; font-size: 12px; color: #666;
            padding: 8px; background: #f1f1f1; border-radius: 4px;
        }
        .back-link { display: block; margin-top: 15px; color: #ff4757; text-decoration: none; font-weight: bold; }
    </style>
</head>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
<body>

<div class="container">
    <h2>Rail Fence Cipher</h2>
    <div class="input-group">
        <label>Plaintext:</label>
        <input type="text" id="text" placeholder="Nhập nội dung...">
    </div>
    <div class="input-group">
        <label>Số hàng (Key):</label>
        <input type="number" id="key" value="2" min="2">
    </div>
    <div class="button-group">
        <button class="btn-encrypt" onclick="encrypt()">Mã hóa</button>
        <button class="btn-decrypt" onclick="decrypt()">Giải mã</button>
    </div>
    <div id="result">Kết quả: </div>
    <div class="nav-links">
        <a href="railfence.html">Rail Fence</a>
        <a href="playfair.html">Playfair</a>
        <a href="caesar.html">Caesar</a>
    </div>
    <a href="nhi.php" class="back-link">Chuyển đến trang cá nhân <i class="bi bi-arrow-right"></i></a>

</div>

<script>
let lastCipher = "";
function railFenceEncrypt(text, key) {
    if (key <= 1) return text;
    let rail = Array.from({ length: key }, () => []);
    let dirDown = false, row = 0;
    for (let char of text) {
        rail[row].push(char);
        if (row === 0 || row === key - 1) dirDown = !dirDown;
        row += dirDown ? 1 : -1;
    }
    return rail.map(r => r.join("")).join("");
}
function railFenceDecrypt(cipher, key) {
    if (key <= 1) return cipher;
    let rail = Array.from({ length: key }, () => Array(cipher.length).fill('\n'));
    let dirDown, row = 0, col = 0;
    for (let i = 0; i < cipher.length; i++) {
        if (row === 0) dirDown = true;
        if (row === key - 1) dirDown = false;
        rail[row][col++] = '*';
        row += dirDown ? 1 : -1;
    }
    let idx = 0;
    for (let i = 0; i < key; i++)
        for (let j = 0; j < cipher.length; j++)
            if (rail[i][j] === '*' && idx < cipher.length) rail[i][j] = cipher[idx++];
    let res = ""; row = 0; col = 0;
    for (let i = 0; i < cipher.length; i++) {
        if (row === 0) dirDown = true;
        if (row === key - 1) dirDown = false;
        res += rail[row][col++];
        row += dirDown ? 1 : -1;
    }
    return res;
}
function encrypt() {
    let t = document.getElementById("text").value, k = parseInt(document.getElementById("key").value);
    lastCipher = railFenceEncrypt(t, k);
    document.getElementById("result").innerHTML = "<strong>Encrypted:</strong> " + lastCipher;
}
function decrypt() {
    let k = parseInt(document.getElementById("key").value);
    if (!lastCipher) { alert("Chưa có dữ liệu!"); return; }
    document.getElementById("result").innerHTML = "<strong>Decrypted:</strong> " + railFenceDecrypt(lastCipher, k);
}
</script>
</body>
</html>
