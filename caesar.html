        input {
            width: 100%;

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
<body>

<div class="container">
    <h2>Caesar Cipher</h2>

    <div class="input-group">
        <label>Plaintext:</label>
        <input type="text" id="text" placeholder="Nhập văn bản...">
    </div>

    <div class="input-group">
        <label>Key (k):</label>
        <input type="number" id="key" value="3">
    </div>

    <div class="button-group">
        <button onclick="encrypt()">Mã hóa</button>
        <button onclick="decrypt()">Giải mã</button>
    </div>

    <div id="result">Kết quả sẽ hiện ở đây...</div>

    <div class="nav-links">
        <a href="railfence.html">Rail Fence</a>
        <a href="caesar.html">Caesar</a>
        <a href="rsa.html">RSA</a>
    </div>
    
    <a href="nhi.php" class="back-link">Chuyển đến trang cá nhân <i class="bi bi-arrow-right"></i></a>

</div>

<script>
    // Giữ nguyên phần logic JavaScript của bạn ở đây
    let lastCipher = ""; 

    function caesarCipher(str, shift) {
        let result = "";
        for (let i = 0; i < str.length; i++) {
            let char = str[i];
            if (char.match(/[a-z]/i)) {
                let code = str.charCodeAt(i);
                if (code >= 65 && code <= 90) {
                    char = String.fromCharCode(((code - 65 + shift) % 26 + 26) % 26 + 65);
                } else if (code >= 97 && code <= 122) {
                    char = String.fromCharCode(((code - 97 + shift) % 26 + 26) % 26 + 97);
                }
            }
            result += char;
        }
        return result;
    }

    function encrypt() {
        let text = document.getElementById("text").value;
        let key = parseInt(document.getElementById("key").value) || 0;
        lastCipher = caesarCipher(text, key);
        document.getElementById("result").innerHTML = "<strong>Encrypted:</strong> " + lastCipher;
    }

    function decrypt() {
        let key = parseInt(document.getElementById("key").value) || 0;
        if (lastCipher === "") {
            document.getElementById("result").innerText = "Chưa có dữ liệu để giải mã!";
            return;
        }
        let decrypted = caesarCipher(lastCipher, -key);
        document.getElementById("result").innerHTML = "<strong>Decrypted:</strong> " + decrypted;
    }
</script>

</body>
