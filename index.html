<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giới thiệu thành viên nhóm 3</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-sub: #6b7280;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .header h1 {
            font-size: 2.5rem;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--text-sub);
            font-size: 1.1rem;
        }

        .team-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            max-width: 1100px;
            width: 100%;
        }

        .member-card {
            background: var(--card-bg);
            border-radius: 1.5rem;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .member-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.15);
        }

        .avatar-container {
            width: 120px;
            height: 120px;
            margin: 0 auto 1.5rem;
            background: #e5e7eb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid var(--primary-color);
            transition: transform 0.3s ease;
        }

        .member-card:hover .avatar-container {
            transform: scale(1.1);
        }

        .avatar-container svg {
            width: 60px;
            height: 60px;
            fill: var(--primary-color);
        }

        .member-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .member-role {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1rem;
            display: block;
        }

        .member-desc {
            font-size: 0.95rem;
            color: var(--text-sub);
            line-height: 1.6;
        }

        .social-links {
            margin-top: 1.5rem;
            display: flex;
            justify-content: center;
            gap: 1rem;
        }

        .btn-contact {
            margin-top: 1.5rem;
            display: inline-block;
            padding: 0.6rem 1.5rem;
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            border-radius: 2rem;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        .btn-contact:hover {
            opacity: 0.9;
        }

        /* Responsive adjustments */
        @media (max-width: 640px) {
            .header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Thành Viên Nhóm 3</h1>
        <p>Web vẫn đang trong quá trình làm</p>
    </div>

    <div class="team-container">
        <!-- Thành viên 1 -->
        <div class="member-card">
            <div class="avatar-container">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </div>
            <span class="member-role">Kỹ Thuật</span>
            <h2 class="member-name">Trương Vang Việt</h2>
            <p class="member-desc">Coder</p>
            <p class="member-desc">4651050319</p>
            <a href="#" class="btn-contact">Liên hệ</a>
        </div>

        <!-- Thành viên 2 -->
        <div class="member-card">
            <div class="avatar-container">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </div>
            <span class="member-role">Trưởng nhóm</span>
            <h2 class="member-name">Quốc Hùng</h2>
            <p class="member-desc">Leader kim coder</p>
            <p class="member-desc">4651050104</p>
            <a href="#" class="btn-contact">Liên hệ</a>
        </div>

        <!-- Thành viên 3 -->
        <div class="member-card">
            <div class="avatar-container">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </div>
            <span class="member-role">Thiết kế</span>
            <h2 class="member-name">Bảo Nhi</h2>
            <p class="member-desc">Coder </p>
            <p class="member-desc">4651050187</p>
            <a href="#" class="btn-contact">Liên hệ</a>
        </div>
    </div>

</body>
</html>
